name: CodeAnt CI Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  codeant_scan:
    name: Run CodeAnt CI scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run CodeAnt CI Scan
        uses: CodeAnt-AI/codeant-ci-scan-action@e617ef8122d2a0d43a4cee5faf286d163d340655 # v0.0.6
        with:
          access_token: ${{ secrets.CODEANT_API_TOKEN }}
