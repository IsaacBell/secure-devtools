name: Security gate

# pull_request_target runs this file and the toolchain from the base branch, so a
# pull request cannot change the gate that checks it. The pull request's code is
# checked out as data only: nothing from it is executed, no secrets are exposed,
# and the token is read-only. The toolchain is installed before any pull request
# file is on disk.
#
# The scanner is the latest stable am-i-hacked release from npm, pinned to an exact
# version, never the unreleased source on main. Bump AIH_VERSION when a new release
# ships (docs/RELEASING.md).
on:
  push:
    branches: [main]
  pull_request_target:

permissions:
  contents: read

env:
  AIH_VERSION: 2.1.0

jobs:
  security-gate:
    name: Security gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out the gate (base branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain (base branch mise.toml)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.12

      # nosemgrep: yaml.github-actions.security.pull-request-target-code-checkout.pull-request-target-code-checkout -- reviewed: the scanner only reads these files (rg, sed, git ls-files) and never runs them; see the note at the top.
      - name: Check out the code under review
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: .review
          persist-credentials: false

      - name: Scan
        env:
          TARGET: ${{ github.event_name == 'pull_request_target' && '.review' || '.' }}
        run: npx --yes "am-i-hacked@${AIH_VERSION}" "$TARGET"

      - name: Scan runner (login items, crontab, shell startup, agent config, processes)
        run: npx --yes "am-i-hacked@${AIH_VERSION}" --system
        # The hosted runner image is not ours; report its findings without blocking merges.
        continue-on-error: true
