rules:
  - id: ssrf-unchecked-url-javascript
    languages: [js, ts]
    severity: WARNING
    message: >-
      This request's URL is not a fixed string in the source and does not
      pass through a guard function first. If the URL can be influenced from
      outside this server's own configuration, an attacker can point it at
      the server's private network or its cloud metadata address
      (server-side request forgery). Validate the scheme, port and resolved
      address before the request goes out — see the ssrf-safe-fetch skill.
    metadata:
      cwe: "CWE-918: Server-Side Request Forgery (SSRF)"
      owasp:
        - "A10:2021 - Server-Side Request Forgery"
      category: security
      subcategory: [vuln]
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      technology: [javascript, typescript, node, fetch, axios, got, node-fetch]
      references:
        - https://owasp.org/www-community/attacks/Server_Side_Request_Forgery
    patterns:
      - pattern-either:
          - pattern: fetch($URL, ...)
          - pattern: axios.get($URL, ...)
          - pattern: axios.post($URL, ...)
          - pattern: axios.put($URL, ...)
          - pattern: axios.patch($URL, ...)
          - pattern: axios.delete($URL, ...)
          - pattern: axios($URL, ...)
          - pattern: got($URL, ...)
          - pattern: got.get($URL, ...)
          - pattern: got.post($URL, ...)
          - pattern: http.get($URL, ...)
          - pattern: http.request($URL, ...)
          - pattern: https.get($URL, ...)
          - pattern: https.request($URL, ...)
      - metavariable-pattern:
          metavariable: $URL
          patterns:
            - pattern-not: "\"...\""
            - pattern-not: "'...'"
            - pattern-not: check_public_url(...)
            - pattern-not: assert_public_url(...)
            - pattern-not: checkPublicUrl(...)
            - pattern-not: assertPublicUrl(...)
            - pattern-not: safe_fetch(...)
            - pattern-not: safeFetch(...)
