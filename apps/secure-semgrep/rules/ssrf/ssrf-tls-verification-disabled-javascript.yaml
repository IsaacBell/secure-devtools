rules:
  - id: ssrf-tls-verification-disabled-javascript
    languages: [js, ts]
    severity: WARNING
    message: >-
      TLS certificate verification is turned off (`rejectUnauthorized:
      false`). Without it, a network attacker, or a redirect to an address
      the attacker controls, can intercept or redirect the request
      unnoticed. Remove it; if a private CA is the real problem, pass its
      certificate with the `ca` option instead. See the ssrf-safe-fetch
      skill.
    metadata:
      cwe: "CWE-295: Improper Certificate Validation"
      owasp:
        - "A02:2021 - Cryptographic Failures"
      category: security
      subcategory: [vuln]
      confidence: HIGH
      likelihood: LOW
      impact: HIGH
      technology: [javascript, typescript, node, axios, got, https]
      references:
        - https://owasp.org/www-community/attacks/Server_Side_Request_Forgery
    pattern: "{ ..., rejectUnauthorized: false, ... }"
