rules:
  - id: ssrf-tls-verification-disabled-python
    languages: [python]
    severity: WARNING
    message: >-
      TLS certificate verification is turned off for this request
      (`verify=False`). Without it, a network attacker, or a redirect to an
      address the attacker controls, can intercept or redirect the request
      unnoticed. Remove `verify=False`; if a private CA is the real problem,
      pass its bundle with `verify="/path/to/ca-bundle.pem"` instead. See the
      ssrf-safe-fetch skill.
    metadata:
      cwe: "CWE-295: Improper Certificate Validation"
      owasp:
        - "A02:2021 - Cryptographic Failures"
      category: security
      subcategory: [vuln]
      confidence: HIGH
      likelihood: LOW
      impact: HIGH
      technology: [python, requests, httpx]
      references:
        - https://owasp.org/www-community/attacks/Server_Side_Request_Forgery
    patterns:
      - pattern-either:
          - pattern: requests.$METHOD(..., verify=False, ...)
          - pattern: $SESSION.verify = False
          - pattern: httpx.$METHOD(..., verify=False, ...)
          - pattern: httpx.Client(..., verify=False, ...)
          - pattern: httpx.AsyncClient(..., verify=False, ...)
