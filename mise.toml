[tools]
node = "24"
pnpm = "10"
shellcheck = "latest"
shfmt = "latest"
ripgrep = "latest"
jq = "latest"
# trivy = "latest"
semgrep = "latest"

[settings]
minimum_release_age = "7d"
# pnpm and trivy cut releases frequently enough that the 7d window is not useful.
minimum_release_age_excludes = ["pnpm"]

# Tasks are thin aliases over the canonical pnpm scripts (package.json) so
# devs, git hooks, and CI all share one interface. Run with: mise run <task>
[tasks.default]
description = "List available tasks"
run = "mise tasks"

[tasks.setup]
description = "Install JS dependencies and git hooks (run once after mise install)"
run = "pnpm install"

[tasks.check]
description = "Lint, format-check, and run tests in every workspace package"
run = "pnpm check"

[tasks.test]
description = "Run the bats test suite"
run = "pnpm -r --if-present test"

[tasks.lint]
description = "Run shellcheck on shell sources"
run = "pnpm -r --if-present lint"

[tasks.fmt]
description = "Format shell sources with shfmt"
run = "pnpm -r --if-present format"

[tasks.fmt-check]
description = "Verify shell sources are shfmt-clean"
run = "pnpm -r --if-present format:check"

[tasks.snyk-scan-deps]
description = "Snyk dependency scan (needs the snyk CLI and a Snyk login)"
run = "snyk test --all-projects"

[tasks.snyk-code-scan]
description = "Snyk code scan (needs the snyk CLI and a Snyk login)"
run = "snyk code test --all-projects"

[tasks.semgrep]
# Full static-analysis pass over this repository (evidence mode: exits 0 so a
# scan that finds issues still produces a report instead of breaking CI).
# Findings are reviewable; use `mise run semgrep-strict` to turn them into a gate.
description = "Run secure-semgrep over the repo; report findings without failing (evidence)"
run = "bash apps/secure-semgrep/bin/secure-semgrep.sh -e -L node -L py ."

[tasks.semgrep-strict]
description = "Run secure-semgrep over the repo; exit 1 on any finding (gate)"
run = "bash apps/secure-semgrep/bin/secure-semgrep.sh -L node -L py ."

[tasks.semgrep-ci]
run = "semgrep scan --config apps/secure-semgrep/rules --config p/default --config p/security-audit --sarif --output=semgrep.sarif"

[tasks.semgrep-check]
description = "Validate every bundled secure-semgrep rule parses"
dir = "apps/secure-semgrep"
run = "pnpm validate"

[tasks.gate]
description = "Run the am-i-hacked scanner over the whole repository"
run = "bash apps/am-i-hacked/bin/scanner.sh ."

[tasks.gate-system]
description = "Audit this machine: login items and signatures, crontab, shell startup files, agent config, processes"
run = "bash apps/am-i-hacked/bin/scanner.sh --system"

[tasks.am-i-being-recorded]
description = "Audit local capture surfaces and browser extensions (macOS/Linux)"
run = "bash apps/am-i-being-recorded/bin/am-i-being-recorded.sh"

[tasks.publish]
description = "Publish one package to npm (2FA), then tag it. Usage: mise run publish apps/<package>"
depends = ["check"]
run = "bash scripts/release.sh publish"

[tasks.publish-dry-run]
description = "List the files one package would publish. Usage: mise run publish-dry-run apps/<package>"
run = "bash scripts/release.sh dry-run"

[tasks.export-public]
description = "Stage the public repository as one fresh commit. Usage: mise run export-public <empty-dir>"
run = "bash scripts/export-public.sh"

[tasks.doctor]
description = "Diagnose the dev environment (mise doctor)"
run = "mise doctor"
